# Structural files are never editable. The design, the motion and the code stay
# with the studio — this is what stops the site drifting off-brand.
_editables:
  content:
    blockquote: true
    bold: true
    italic: true
    link: true
    bulletedlist: true
    numberedlist: true
    undo: true
    redo: true
    removeformat: true
