# What "add a row" creates.
#
# Without these, CloudCannon can copy an existing row but not create a fresh
# one — which is the difference between "you may edit what is there" and "this
# is yours". Each structure is a blank of the right shape, so an added award,
# quote, step, pathway card or tier arrives complete and correctly coloured
# rather than as an empty object the page then has to survive.
_structures:
